name: sardarji-travel-public
services:
- name: sardarji-travel-public
  github:
    repo: Arvinder0099/sardarjitravel
    branch: main
  build_command: npm run build:public
  run_command: npm start
  http_port: 3050
  envs:
  - key: SITE_ROLE
    value: public
  - key: ADMIN_BASE_URL
    value: https://admin.sardarjitravel.ae
  - key: NODE_ENV
    value: production
  - key: NEXT_PUBLIC_SITE_URL
    value: https://sardarjitravel.ae
  health_check:
    http_path: /
  http_port: 3050
  instance_count: 1
  instance_size_slug: basic-xs
